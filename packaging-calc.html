<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>包材計算工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#EDE9E0; --border:#D4CFC4;
    --text:#1A1814; --text2:#6B6860; --muted:#9B9890;
    --accent:#2D5A3D; --accent-light:#E8F0EB;
    --warn:#B26A00; --warn-bg:#FFF4E0; --danger:#C62828; --danger-bg:#FDECEA; --info-bg:#E8F1FB; --info:#1565C0;
    --radius:8px; --radius-lg:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
  .mono{font-family:'Space Mono',monospace}
  .header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .header h1{font-size:18px;font-weight:700;letter-spacing:.05em}
  .header .ver{font-size:11px;opacity:.65;font-family:'Space Mono',monospace}
  .header .sp{flex:1}
  .header .who{font-size:12px;opacity:.85}
  .header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
  .pickbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pickbar label{font-size:12px;color:var(--text2)}
  select,input[type=text]{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);max-width:100%}
  .nav-tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
  .nav-tab{padding:11px 18px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;color:var(--text2);white-space:nowrap}
  .nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
  .main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
  .card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3 .sub{font-size:12px;color:var(--muted);font-weight:400}
  .btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.small{padding:4px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .small{font-size:12px}
  .upload-zone{border:2px dashed var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:36px 20px;text-align:center;cursor:pointer;position:relative}
  .upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:var(--accent-light)}
  .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .upload-zone .ic{font-size:40px;margin-bottom:8px}
  .alert{border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.6}
  .alert.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #F0D3A0}
  .alert.danger{background:var(--danger-bg);color:var(--danger);border:1px solid #F3B9B3}
  .alert.info{background:var(--info-bg);color:var(--info);border:1px solid #BCD4F0}
  .alert.ok{background:var(--accent-light);color:var(--accent);border:1px solid #BFD6C6}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--surface2);text-align:left;padding:7px 8px;font-weight:600;color:var(--text2);white-space:nowrap;border-bottom:1px solid var(--border)}
  td{padding:7px 8px;border-bottom:1px solid #EEEAE2;vertical-align:top}
  tr.flag-red td{background:#FFF6F5}
  tr.flag-edit td{background:#F4F8FF}
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--surface2);color:var(--text2);margin:1px 2px 1px 0;white-space:nowrap}
  .chip.ok{background:var(--accent-light);color:var(--accent)}
  .chip.red{background:var(--danger-bg);color:var(--danger)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.blue{background:var(--info-bg);color:var(--info)}
  .sum-grid{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .sum-grid div{padding:9px 12px;border-bottom:1px solid #EEEAE2}
  .sum-grid .n{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;text-align:right;color:var(--accent)}
  .sum-grid .zero{color:var(--muted);font-weight:400;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--surface2);border-radius:var(--radius);padding:10px 12px}
  .stat .l{font-size:11px;color:var(--text2)} .stat .v{font-family:'Space Mono',monospace;font-size:20px;font-weight:700}
  .stat.red .v{color:var(--danger)} .stat.warn .v{color:var(--warn)} .stat.blue .v{color:var(--info)}
  .items{font-size:12px;color:var(--text2);line-height:1.5;min-width:220px}
  table.orders{min-width:760px}
  table.orders td:nth-child(2){min-width:120px}
  .diff-add{color:var(--accent)} .diff-del{color:var(--danger);text-decoration:line-through}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1814;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;max-width:90vw;display:none}
  .center{text-align:center;padding:60px 16px}
  @media (max-width:600px){ .header{padding:12px 16px} .pickbar{padding:10px 16px} .main{padding:16px 12px 60px} th,td{padding:6px 6px} }
</style>
</head>
<body>
<div class="header">
  <div><h1>📦 包材計算工具</h1><div class="ver" id="ver"></div></div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button id="btn-logout" style="display:none" onclick="doLogout()">登出</button>
</div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   包材計算工具（通用版）
   - 依倉庫／客戶讀 ERP（ezfun-warehouse-billing）的耗材工序當包材選項
   - 規則存在 Firestore pkg_calc_rules/{cid}，用 Excel 上傳／下載維護
   - 出貨明細自動找有「單號＋數量」表頭的分頁，依物流方式分通路計算
   - 📐 專案試算：大專案依商品尺寸事先估包材（合併自 packaging-calculator.html、包材需求評估.html）
   - ?demo=1：假資料測試模式，不連資料庫
   ===================================================================== */
const PKG_VERSION = 'v2.3';
const DEMO = new URLSearchParams(location.search).has('demo') || /demo/.test(location.hash);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getTodayTW(){ return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei'}).format(new Date()); }
function fmtTime(ms){ if(!ms) return ''; const d = new Date(ms); return new Intl.DateTimeFormat('zh-TW', {timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false}).format(d); }
let toastT = null;
function toast(msg, ms = 2500){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms); }
const splitKw = s => String(s ?? '').split(/[,，、\n]/).map(x => x.trim()).filter(Boolean);
const isConsumable = p => p.category === '耗材' || (!p.category && /紙箱|箱|袋/.test(p.name || ''));

/* ================= 預設規則（新客戶的範本，件數區間沿用暮雨 v1.0，名稱用 ERP 標準工序名稱） ================= */
const DEFAULT_RULES = () => ({
  channels: [
    {name:'宅配', keywords:['宅配','黑貓','新竹','郵局','宅急便'], maxPkg:''},
    {name:'超取', keywords:['超商','超取','7-11','711','全家','萊爾富','OK'], maxPkg:''},
  ],
  rules: [
    {ch:'', min:1, max:2, pkg:'破壞袋-4元'},
    {ch:'', min:3, max:5, pkg:'俬儲紙箱[M](46-60)'},
    {ch:'', min:6, max:10, pkg:'俬儲紙箱[L](61-75)'},
    {ch:'', min:11, max:20, pkg:'俬儲紙箱[XL](76-90)'},
    {ch:'', min:21, max:9999, pkg:'俬儲紙箱[XXL](91-105)'},
  ],
  combos: [], points: [],
  // 約九成客戶每單收訂單處理費；這個客戶沒有這個工序時，上傳會擋下來，刪掉這列即可
  extras: [{ch:'', pkg:'', proc:'訂單處理費'}],
  identify: [],
});

/* ================= 資料層：Firestore 或測試假資料 ================= */
const api = DEMO ? demoApi() : fireApi();

function fireApi(){
  firebase.initializeApp({
    apiKey: "AIzaSyBmb_51Pq-QatHwKkcrNlKw0B6e8YmKAsw",
    authDomain: "ezfun-warehouse-billing.firebaseapp.com",
    projectId: "ezfun-warehouse-billing",
    storageBucket: "ezfun-warehouse-billing.firebasestorage.app",
    messagingSenderId: "175590672953",
    appId: "1:175590672953:web:6304ddce7b45b191529be8"
  });
  const auth = firebase.auth(), db = firebase.firestore();
  return {
    onAuth(cb){ auth.onAuthStateChanged(cb); auth.getRedirectResult().catch(e => toast('登入失敗：' + (e.code || e.message), 5000)); },
    async login(){
      const p = new firebase.auth.GoogleAuthProvider();
      try{ await auth.signInWithPopup(p); }
      catch(e){
        const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if(e.code === 'auth/popup-blocked') throw new Error('彈出視窗被擋住了：iPhone 請到「設定 → Safari」關閉「阻擋彈出式視窗」，再按一次登入');
        if(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
        if(!ios && e.code === 'auth/operation-not-supported-in-this-environment') return auth.signInWithRedirect(p);
        throw new Error('登入失敗：' + (e.code || e.message));
      }
    },
    logout(){ return auth.signOut(); },
    async profile(user){
      const [u, g] = await Promise.all([db.collection('hub_settings').doc('users').get(), db.collection('hub_settings').doc('global').get().catch(() => null)]);
      const users = u.exists ? u.data() : {}, email = (user.email || '').toLowerCase();
      const rec = users[email] || Object.entries(users).find(([k]) => k.toLowerCase() === email)?.[1];
      const admins = ((g && g.exists && g.data().superAdmins) || []).map(x => String(x).toLowerCase());
      return {ok: !!rec || admins.includes(email), admin: admins.includes(email), blocked: !!(rec && (rec.blockedSystems || []).includes('packaging')),
        name: (rec && rec.name) || user.displayName || email, warehouses: ((rec && rec.warehouses) || []).map(String).filter(Boolean)};
    },
    async warehouses(){ const s = await db.collection('warehouses').get(); return s.docs.map(d => ({id:d.id, ...d.data()})); },
    async customers(){ const s = await db.collection('customers').get(); return s.docs.map(d => ({id:d.id, ...d.data()})); },
    async processes(cid){ const s = await db.collection('customers').doc(cid).collection('processes').get(); return s.docs.map(d => ({id:d.id, ...d.data()})); },
    async getRules(cid){ const d = await db.collection('pkg_calc_rules').doc(cid).get(); return d.exists ? d.data() : null; },
    async saveRules(cid, data){ const ref = db.collection('pkg_calc_rules').doc(cid); await ref.set(data); await ref.collection('history').add(data); },
  };
}

function demoApi(){
  const K = 'pkg_calc_demo_rules';
  const load = () => { try{ return JSON.parse(localStorage.getItem(K) || '{}'); }catch(e){ return {}; } };
  const procs = [
    {id:'p1', name:'訂單處理費', price:15, category:'服務費', order:0},
    {id:'p2', name:'破壞袋-4元', price:4, category:'耗材', order:1},
    {id:'p3', name:'俬儲紙箱[M](46-60)', price:12, category:'耗材', order:2},
    {id:'p4', name:'俬儲紙箱[L](61-75)', price:15, category:'耗材', order:3},
    {id:'p5', name:'俬儲紙箱[XL](76-90)', price:20, category:'耗材', order:4},
    {id:'p6', name:'俬儲紙箱[XXL](91-105)', price:25, category:'耗材', order:5},
    {id:'p7', name:'寄件處理[超商](小)(<60)', price:5, category:'服務費', order:6},
    {id:'p8', name:'寄件處理[超商](中)(61-90)', price:10, category:'服務費', order:7},
    {id:'p9', name:'寄件處理[超商](大)(91-105)', price:20, category:'服務費', order:8},
  ];
  return {
    onAuth(cb){ setTimeout(() => cb({email:'demo@test', displayName:'測試員'}), 0); },
    login(){}, logout(){ location.reload(); },
    async profile(){ return {ok:true, admin:false, blocked:false, name:'測試員', warehouses:['汐止倉']}; },
    async warehouses(){ return [{id:'w1', name:'汐止倉', order:0}, {id:'w2', name:'五股倉', order:1}]; },
    async customers(){ return [{id:'c1', name:'暮雨', wh:'w1'}, {id:'c2', name:'心茶', wh:'w1'}]; },
    async processes(cid){ return cid === 'c1' ? procs : procs.slice(0, 3); },
    async getRules(cid){ return load()[cid] || null; },
    async saveRules(cid, data){ const all = load(); all[cid] = data; try{ localStorage.setItem(K, JSON.stringify(all)); }catch(e){} },
  };
}

/* ================= 狀態 ================= */
const S = {
  me:null, whs:[], custs:[], wh:'', cid:'', procs:[], rules:null, tab:'calc',
  buf:null, filename:'', sheets:[], orders:[], overrides:{}, pendingRules:null, pendingErrors:[], pendingWarns:[],
};
const LS = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
};

/* ================= 登入與倉庫／客戶 ================= */
api.onAuth(async (user) => {
  if(!user){ S.me = null; renderLogin(); return; }
  try{
    const pf = await api.profile(user);
    if(!pf.ok){ renderMsg(`你的帳號（${esc(user.email)}）不在 ERP 帳號清單中，請聯絡管理員到 Hub 新增。`, true); return; }
    if(pf.blocked){ renderMsg('你的帳號沒有包材計算工具的使用權限。', true); return; }
    S.me = {email:(user.email || '').toLowerCase(), ...pf};
    $('who').textContent = S.me.name + (DEMO ? '（測試模式）' : '');
    $('btn-logout').style.display = '';
    const [whs, custs] = await Promise.all([api.warehouses(), api.customers()]);
    // 管理員或沒設定倉庫的帳號看全部倉庫；其他人只看 hub_settings/users.warehouses 裡的倉庫
    const allowAll = S.me.admin || !S.me.warehouses.length;
    S.whs = whs.filter(w => allowAll || S.me.warehouses.includes(w.name)).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name), 'zh-TW'));
    S.custs = custs;
    const lastWh = LS.get('pkg_calc_wh');
    S.wh = S.whs.some(w => w.id === lastWh) ? lastWh : (S.whs[0]?.id || '');
    const lastCid = LS.get('pkg_calc_cid');
    S.cid = whCusts().some(c => c.id === lastCid) ? lastCid : '';
    renderShell();
    if(S.cid) await loadCustomer();
    else render();
  }catch(e){ renderMsg('讀取帳號資料失敗：' + esc(e.message), true); }
});

function whCusts(){ return S.custs.filter(c => c.wh === S.wh).sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh-TW')); }

async function doLogin(){ try{ await api.login(); }catch(e){ toast(e.message, 6000); } }
function doLogout(){ api.logout(); }

async function pickWh(id){ S.wh = id; LS.set('pkg_calc_wh', id); S.cid = ''; S.procs = []; S.rules = null; clearFile(); renderShell(); render(); }
async function pickCust(id){ S.cid = id; LS.set('pkg_calc_cid', id); clearFile(); await loadCustomer(); }

async function loadCustomer(){
  S.procs = []; S.rules = null; S.pendingRules = null;
  if(!S.cid){ render(); return; }
  $('app-main').innerHTML = '<div class="center muted">讀取客戶資料中…</div>';
  try{
    const [procs, rules] = await Promise.all([api.processes(S.cid), api.getRules(S.cid)]);
    S.procs = procs.sort((a, b) => (a.order !== undefined && b.order !== undefined) ? a.order - b.order : String(a.name).localeCompare(String(b.name), 'zh-TW'));
    S.rules = rules;
  }catch(e){ toast('讀取客戶資料失敗：' + e.message, 5000); }
  if(S.buf) recompute();
  render();
}
const curCust = () => S.custs.find(c => c.id === S.cid);
const pkgOptions = () => S.procs.filter(isConsumable).map(p => p.name);

/* ================= 畫面骨架 ================= */
function renderLogin(){
  $('who').textContent = ''; $('btn-logout').style.display = 'none';
  $('app').innerHTML = `<div class="center"><div style="font-size:44px">📦</div><h2 style="margin:12px 0 6px">包材計算工具</h2>
    <p class="muted" style="margin-bottom:18px">使用 ERP（工序計費）的 Google 帳號登入</p>
    <button class="btn" onclick="doLogin()">用 Google 登入</button></div>`;
}
function renderMsg(html, logout){
  $('app').innerHTML = `<div class="center"><p>${html}</p>${logout ? '<p style="margin-top:14px"><button class="btn ghost" onclick="doLogout()">登出</button></p>' : ''}</div>`;
}
function renderShell(){
  const cs = whCusts();
  $('app').innerHTML = `
    <div class="pickbar">
      <label>倉庫</label>
      <select onchange="pickWh(this.value)">${S.whs.map(w => `<option value="${esc(w.id)}" ${w.id === S.wh ? 'selected' : ''}>${esc(w.name)}</option>`).join('') || '<option>（沒有可用的倉庫）</option>'}</select>
      <label>客戶</label>
      <select onchange="pickCust(this.value)"><option value="">— 請選擇客戶 —</option>${cs.map(c => `<option value="${esc(c.id)}" ${c.id === S.cid ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    </div>
    <div class="nav-tabs">
      <div class="nav-tab ${S.tab === 'calc' ? 'active' : ''}" onclick="switchTab('calc')">🧮 計算包材</div>
      <div class="nav-tab ${S.tab === 'rules' ? 'active' : ''}" onclick="switchTab('rules')">⚙️ 規則設定</div>
      <div class="nav-tab ${S.tab === 'project' ? 'active' : ''}" onclick="switchTab('project')">📐 專案試算</div>
    </div>
    <div class="main" id="app-main"></div>`;
}
function switchTab(t){ S.tab = t; renderShell(); render(); }
function render(){
  const m = $('app-main'); if(!m) return;
  m.oninput = m.onchange = null;
  // 專案試算不分客戶，不需要先選客戶
  if(S.tab === 'project'){ m.innerHTML = PJ.html(); PJ.mount(); return; }
  if(!S.cid){ m.innerHTML = '<div class="center muted">請先在上方選擇倉庫和客戶</div>'; return; }
  m.innerHTML = S.tab === 'calc' ? calcHtml() : rulesHtml();
}

/* ================= 出貨明細解析 ================= */
const FIELDS = {
  id:     {label:'單號',     keys:['單號','订单号','單號碼','訂單編號','訂單號碼','訂單號','订单编号','orderid','order_id','訂單id']},
  qty:    {label:'數量',     keys:['數量','数量','qty','quantity','件數','出貨數量']},
  name:   {label:'商品名稱', keys:['商品名稱','商品名称','品名','商品','product','productname']},
  sku:    {label:'商品編號', keys:['商品編號','商品编号','sku','品號','貨號','商品代號','料號']},
  recv:   {label:'收件人',   keys:['收件人','收件人姓名','收貨人']},
  addr:   {label:'收件人地址', keys:['收件人地址','地址','收貨地址','門市']},
  ship:   {label:'物流方式', keys:['物流方式','配送方式','運送方式','物流','出貨方式','配送']},
  sender: {label:'寄件人',   keys:['寄件人','寄件人名稱']},
  date:   {label:'訂單日期', keys:['訂單日期','出貨日期','日期']},
};
const normH = s => String(s ?? '').replace(/\s+/g, '').toLowerCase();

// 依表頭文字找欄位：先完全相符，找不到再找「包含」關鍵字的欄（取最短的表頭）
function mapHeaders(row){
  const hs = row.map(normH), map = {}, used = new Set();
  for(const [f, def] of Object.entries(FIELDS)){
    const keys = def.keys.map(normH);
    const i = hs.findIndex((h, j) => h && !used.has(j) && keys.includes(h));
    if(i >= 0){ map[f] = i; used.add(i); }
  }
  for(const [f, def] of Object.entries(FIELDS)){
    if(map[f] !== undefined) continue;
    const keys = def.keys.map(normH);
    let best = -1;
    hs.forEach((h, j) => { if(h && !used.has(j) && keys.some(k => h.includes(k)) && (best < 0 || h.length < hs[best].length)) best = j; });
    if(best >= 0){ map[f] = best; used.add(best); }
  }
  return map;
}

function cellDate(v){
  if(typeof v === 'number' && v > 20000 && v < 80000){ const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  return String(v ?? '').trim().slice(0, 10);
}

function parseWorkbook(wb){
  return wb.SheetNames.map(name => {
    const ws = wb.Sheets[name];
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true, blankrows:true});
    const sh = {name, ok:false, reason:'', headerRow:-1, map:{}, headers:[], rows:[], lastCol:0};
    for(let r = 0; r < Math.min(aoa.length, 15); r++){
      const m = mapHeaders(aoa[r] || []);
      if(m.id !== undefined && m.qty !== undefined){ sh.headerRow = r; sh.map = m; sh.headers = aoa[r]; break; }
    }
    if(sh.headerRow < 0){ sh.reason = aoa.length ? '找不到「單號」和「數量」表頭' : '空白分頁'; return sh; }
    const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
    sh.lastCol = range.e.c;
    const g = (row, f) => sh.map[f] === undefined ? '' : row[sh.map[f]];
    for(let r = sh.headerRow + 1; r < aoa.length; r++){
      const row = aoa[r] || [];
      const id = String(g(row, 'id') ?? '').trim();
      const qty = Number(g(row, 'qty'));
      if(!id || /^(總計|合計|小計|total)$/i.test(id) || !(qty > 0)) continue;
      sh.rows.push({r, id, qty, name:String(g(row, 'name') ?? '').trim(), sku:String(g(row, 'sku') ?? '').trim(),
        recv:String(g(row, 'recv') ?? '').trim(), addr:String(g(row, 'addr') ?? '').trim(), ship:String(g(row, 'ship') ?? '').trim(),
        sender:String(g(row, 'sender') ?? '').trim(), date:g(row, 'date') === '' ? '' : cellDate(g(row, 'date'))});
    }
    if(!sh.rows.length){ sh.reason = '有表頭但沒有數量大於 0 的明細'; return sh; }
    sh.ok = true; sh.use = true;
    return sh;
  });
}

function handleFile(file){
  if(!file) return;
  if(!S.rules){ toast('這個客戶還沒有包材規則，請先到「規則設定」建立'); }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      S.buf = e.target.result;
      const wb = XLSX.read(new Uint8Array(S.buf), {type:'array'});
      S.filename = file.name;
      S.sheets = parseWorkbook(wb);
      S.overrides = {};
      recompute(); render();
    }catch(err){ toast('讀取失敗：' + err.message, 5000); }
  };
  reader.readAsArrayBuffer(file);
}
function clearFile(){ S.buf = null; S.filename = ''; S.sheets = []; S.orders = []; S.overrides = {}; }
function resetFile(){ clearFile(); render(); }
function toggleSheet(i, on){ S.sheets[i].use = on; recompute(); render(); }

/* ================= 包材計算 ================= */
function chOrder(rules){ return rules.channels || []; }

// 該通路的件數規則：有專屬規則就用專屬的，沒有就用「通路空白」的共用規則
function rangeRules(R, ch){
  const own = (R.rules || []).filter(r => r.ch && r.ch === ch);
  return (own.length ? own : (R.rules || []).filter(r => !r.ch)).slice().sort((a, b) => a.min - b.min);
}

function detectChannel(R, o){
  const chs = chOrder(R);
  const hit = text => chs.find(c => [c.name, ...(c.keywords || [])].some(k => k && text.toLowerCase().includes(String(k).toLowerCase())));
  for(const t of o.shipTexts){ const c = hit(t); if(c) return {ch:c.name, by:'物流方式「' + t + '」'}; }
  for(const t of o.sheetNames){ const c = hit(t); if(c) return {ch:c.name, by:'分頁「' + t + '」'}; }
  return {ch:'', by:''};
}

function itemPoint(R, it){
  const pts = R.points || [];
  if(!pts.length) return {pt:1, set:true};
  const bySku = it.sku && pts.find(p => p.sku && String(p.sku).trim().toLowerCase() === it.sku.toLowerCase());
  if(bySku) return {pt:Number(bySku.pt) || 0, set:true};
  const byKw = pts.find(p => p.kw && it.name.includes(String(p.kw).trim()));
  if(byKw) return {pt:Number(byKw.pt) || 0, set:true};
  return {pt:1, set:false};
}

function recompute(){
  const R = S.rules;
  const map = new Map();
  S.sheets.forEach(sh => {
    if(!sh.ok || !sh.use) return;
    sh.rows.forEach(row => {
      let o = map.get(row.id);
      if(!o){ o = {id:row.id, recv:row.recv, addr:row.addr, shipTexts:new Set(), sheetNames:new Set(), items:[], dates:new Set(), senders:new Set()}; map.set(row.id, o); }
      if(row.ship) o.shipTexts.add(row.ship);
      o.sheetNames.add(sh.name);
      if(row.date) o.dates.add(row.date);
      if(row.sender) o.senders.add(row.sender);
      o.items.push({name:row.name, sku:row.sku, qty:row.qty});
    });
  });
  S.orders = [...map.values()].map(o => {
    o.qty = o.items.reduce((s, it) => s + it.qty, 0);
    o.flags = [];
    if(!R){ o.ch = ''; o.count = o.qty; o.pts = o.qty; o.auto = ''; return o; }
    const d = detectChannel(R, o); o.ch = d.ch; o.chBy = d.by;
    if(!o.ch) o.flags.push('unclassified');
    const usePts = (R.points || []).length > 0;
    let pts = 0, unset = 0;
    o.items.forEach(it => { const p = itemPoint(R, it); it.pt = p.pt; it.unset = !p.set; pts += p.pt * it.qty; if(!p.set) unset++; });
    o.pts = Math.round(pts * 100) / 100;
    o.count = usePts ? Math.ceil(o.pts - 1e-9) : o.qty;
    if(unset) o.flags.push('unsetPoint');
    // 1. 組合規則（該通路或通路空白；關鍵字全部出現在品名才套用）
    let pkg = '', why = '';
    for(const c of (R.combos || [])){
      if(c.ch && c.ch !== o.ch) continue;
      const kws = splitKw(c.keywords);
      if(kws.length && kws.every(k => o.items.some(it => it.name.includes(k) || it.sku === k))){ pkg = c.pkg; why = '組合規則：' + kws.join('＋'); break; }
    }
    // 2. 件數規則
    if(!pkg){
      const rr = rangeRules(R, o.ch);
      const r = rr.find(x => o.count >= x.min && o.count <= x.max);
      if(r){ pkg = r.pkg; why = `${usePts ? '點數' : '件數'} ${o.count}（${r.min}–${r.max >= 9999 ? '以上' : r.max}）`; }
    }
    if(!pkg) o.flags.push('noRule');
    o.auto = pkg; o.why = why;
    return o;
  });
  applyFinal();
}

// 最終包材＝手動修改優先，再判斷是否超出通路上限
function applyFinal(){
  const R = S.rules;
  S.orders.forEach((o, i) => {
    o.idx = i;
    o.pkg = S.overrides[o.id] || o.auto;
    // 附加工序：通路相符（空白＝全部）且包材相符（空白＝不論包材）的每一列都套用，每單 1 次
    o.extras = R ? [...new Set((R.extras || []).filter(e => (!e.ch || e.ch === o.ch) && (!e.pkg || (o.pkg && e.pkg === o.pkg))).map(e => e.proc))] : [];
    o.edited = !!S.overrides[o.id] && S.overrides[o.id] !== o.auto;
    o.flags = o.flags.filter(f => f !== 'over');
    if(R && o.ch && o.pkg){
      const ch = chOrder(R).find(c => c.name === o.ch);
      if(ch && ch.maxPkg){
        const rank = name => { const rr = rangeRules(R, o.ch); const i2 = rr.findIndex(r => r.pkg === name); return i2; };
        const a = rank(o.pkg), b = rank(ch.maxPkg);
        if(a >= 0 && b >= 0 && a > b) o.flags.push('over');
      }
    }
  });
}
function setOv(i, v){
  const o = S.orders[i]; if(!o) return;
  if(!v || v === o.auto) delete S.overrides[o.id]; else S.overrides[o.id] = v;
  applyFinal(); render();
}

  unclassified:{t:'未分類通路', c:'red'},

};

          : `<span class="chip">${d.label}→${XLSX.utils.encode_col(sh.map[f])}欄「${esc(sh.headers[sh.map[f]])}」</span>`).join('') : ''}</td>
    </tr>`).join('')}</tbody></table></div></div>`;

    <div class="sum-grid">${ordered.map(n => `<div>${esc(n)}</div><div class="n ${tally[n] ? '' : 'zero'}">${tally[n] || 0}</div>`).join('')}</div>

          <td><select onchange="setOv(${o.idx}, this.value)">

            </select><div class="small muted" style="margin-top:3px">${esc(o.why || '')}</div>
            ${(o.extras || []).map(n => `<div><span class="chip blue">＋ ${esc(n)}</span></div>`).join('')}</td>
          <td>${o.edited ? '<span class="chip blue">已手動修改</span>' : ''}${o.flags.map(f => `<span class="chip ${FLAG[f].c}">${FLAG[f].t}</span>`).join('')}</td>
        </tr>`; }).join('')}
      </tbody></table></div></div>`;
  }
  return h;
}

// 包材＋附加工序的數量，依 ERP 工序順序排列（耗材工序即使 0 也列出）
function tallyAll(){
  const tally = {};
  S.orders.forEach(o => { [o.pkg, ...(o.extras || [])].forEach(n => { if(n) tally[n] = (tally[n] || 0) + 1; }); });
  const ordered = S.procs.filter(p => isConsumable(p) || tally[p.name]).map(p => p.name);
  Object.keys(tally).forEach(n => { if(!ordered.includes(n)) ordered.push(n); });
  return {tally, ordered};
}
function summaryLines(){
  const {tally, ordered} = tallyAll();
  return ordered.filter(n => tally[n]).map(n => [n, tally[n]]);
}
async function copySummary(){
  const txt = summaryLines().map(([n, c]) => `${n}\t${c}`).join('\n');
  try{ await navigator.clipboard.writeText(txt); toast('已複製'); }
  catch(e){ prompt('複製以下內容：', txt.replace(/\t/g, ' ')); }
}

function exportResult(){
  // cellNF：保留原本的數字格式，日期欄才不會變成 46352 這種序號
  const wb = XLSX.read(new Uint8Array(S.buf), {type:'array', cellStyles:true, cellNF:true});
  const byId = new Map(S.orders.map(o => [o.id, o]));
  S.sheets.forEach(sh => {
    if(!sh.ok || !sh.use) return;
    const ws = wb.Sheets[sh.name], c = sh.lastCol + 1;
    XLSX.utils.sheet_add_aoa(ws, [['包材', '附加工序']], {origin:{r:sh.headerRow, c}});
    sh.rows.forEach(row => { const o = byId.get(row.id); XLSX.utils.sheet_add_aoa(ws, [o ? [(o.pkg || '無對應規則') + (o.edited ? '（手動）' : ''), (o.extras || []).join('、')] : ['', '']], {origin:{r:row.r, c}}); });
  });
  const aoa = [['工序', '數量'], ...summaryLines(), [], ['單號', '收件人', '通路', '件數', '包材', '附加工序', '提醒']];
  S.orders.forEach(o => aoa.push([o.id, o.recv, o.ch || '未分類', o.qty, o.pkg || '', (o.extras || []).join('、'), [o.edited ? '已手動修改' : '', ...o.flags.map(f => FLAG[f].t)].filter(Boolean).join('、')]));
  const name = '包材彙總';
  if(wb.SheetNames.includes(name)) delete wb.Sheets[name], wb.SheetNames.splice(wb.SheetNames.indexOf(name), 1);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
  XLSX.writeFile(wb, S.filename.replace(/\.(xlsx|xls|csv)$/i, '') + '_包材_' + getTodayTW() + '.xlsx');
}

/* ================= 規則設定 ================= */
const RULE_SHEETS = {
  channels:{sheet:'通路設定', head:['通路', '物流方式關鍵字（逗號分隔）', '最大包材（超過就提醒，可空白）']},
  rules:   {sheet:'件數規則', head:['通路（空白＝所有通路共用）', '下限', '上限', '包材']},
  combos:  {sheet:'組合規則', head:['通路（空白＝所有通路）', '關鍵字（逗號分隔，全部出現才套用）', '包材']},

function readRulesFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const {rules, errors, warns} = parseRulesWb(wb);
      S.pendingRules = rules; S.pendingErrors = errors; S.pendingWarns = warns;
      render();
    }catch(err){ toast('讀取失敗：' + err.message, 5000); }
  };
  reader.readAsArrayBuffer(file);
}

function parseRulesWb(wb){
  const errors = [], warns = [];
  const sheet = k => {
    const n = RULE_SHEETS[k].sheet;
    if(!wb.Sheets[n]) return null;
    return XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:'', raw:true}).slice(1)
      .map((r, i) => ({r: r.map(v => typeof v === 'string' ? v.trim() : v), line: i + 2}))
      .filter(x => x.r.some(v => v !== '' && v !== null));
  };
  const procNames = new Set(S.procs.map(p => p.name));
  const consum = new Set(pkgOptions());
  const chkPkg = (name, where) => {
    if(!name){ errors.push(`${where}：包材空白`); return; }
    if(!procNames.has(name)) errors.push(`${where}：「${name}」不是這個客戶的 ERP 工序名稱`);
    else if(!consum.has(name)) warns.push(`${where}：「${name}」在 ERP 不是「耗材」分類`);
  };
  const R = {channels:[], rules:[], combos:[], points:[], extras:[], identify:[]};
  const ch = sheet('channels');
  if(!ch) errors.push('缺少「通路設定」分頁');
  else ch.forEach(({r, line}) => {
    const name = String(r[0] || '');
    if(!name){ errors.push(`通路設定第 ${line} 列：通路名稱空白`); return; }
    if(R.channels.some(c => c.name === name)){ errors.push(`通路設定第 ${line} 列：通路「${name}」重複`); return; }
    const maxPkg = String(r[2] || '');
    if(maxPkg) chkPkg(maxPkg, `通路設定第 ${line} 列`);
    R.channels.push({name, keywords:splitKw(r[1]), maxPkg});
  });
  const chNames = new Set(R.channels.map(c => c.name));
  const rr = sheet('rules');
  if(!rr || !rr.length) errors.push('「件數規則」分頁不存在或是空的');
  else rr.forEach(({r, line}) => {
    const w = `件數規則第 ${line} 列`, c = String(r[0] || ''), min = Number(r[1]), max = Number(r[2]), pkg = String(r[3] || '');
    if(c && !chNames.has(c)) errors.push(`${w}：通路「${c}」沒有在通路設定裡`);
    if(!Number.isFinite(min) || !Number.isFinite(max) || r[1] === '' || r[2] === '') errors.push(`${w}：下限／上限要填數字`);
    else if(min > max) errors.push(`${w}：下限大於上限`);
    chkPkg(pkg, w);
    R.rules.push({ch:c, min, max, pkg});
  });
  // 同一通路的區間不能重疊
  [...new Set(R.rules.map(r => r.ch))].forEach(c => {
    const xs = R.rules.filter(r => r.ch === c).sort((a, b) => a.min - b.min);
    for(let i = 1; i < xs.length; i++) if(xs[i].min <= xs[i - 1].max) errors.push(`件數規則：${c || '共用'}的 ${xs[i - 1].min}–${xs[i - 1].max} 和 ${xs[i].min}–${xs[i].max} 重疊`);
    for(let i = 1; i < xs.length; i++) if(xs[i].min > xs[i - 1].max + 1) warns.push(`件數規則：${c || '共用'}的 ${xs[i - 1].max} 和 ${xs[i].min} 之間有空檔，落在中間的單會「無對應規則」`);
  });
  R.channels.forEach(c => { if(!R.rules.some(r => r.ch === c.name) && !R.rules.some(r => !r.ch)) errors.push(`通路「${c.name}」沒有任何件數規則（也沒有共用規則）`); });
  (sheet('combos') || []).forEach(({r, line}) => {
    const w = `組合規則第 ${line} 列`, c = String(r[0] || '');
    if(c && !chNames.has(c)) errors.push(`${w}：通路「${c}」沒有在通路設定裡`);
    if(!splitKw(r[1]).length) errors.push(`${w}：關鍵字空白`);
    chkPkg(String(r[2] || ''), w);
    R.combos.push({ch:c, keywords:splitKw(r[1]).join(','), pkg:String(r[2] || '')});
  });
  (sheet('points') || []).forEach(({r, line}) => {
    const w = `商品點數第 ${line} 列`, pt = Number(r[2]);
    if(!r[0] && !r[1]) errors.push(`${w}：商品編號和關鍵字至少填一個`);
    if(!Number.isFinite(pt) || r[2] === '' || pt < 0) errors.push(`${w}：點數要填 0 以上的數字`);
    R.points.push({sku:String(r[0] || ''), kw:String(r[1] || ''), pt});
  });
  (sheet('extras') || []).forEach(({r, line}) => {
    const w = `附加工序第 ${line} 列`, c = String(r[0] || ''), pkg = String(r[1] || ''), proc = String(r[2] || '');
    if(c && !chNames.has(c)) errors.push(`${w}：通路「${c}」沒有在通路設定裡`);
    if(pkg) chkPkg(pkg, w);
    if(!proc) errors.push(`${w}：附加工序空白`);
    else if(!procNames.has(proc)) errors.push(`${w}：「${proc}」不是這個客戶的 ERP 工序名稱`);
    R.extras.push({ch:c, pkg, proc});
  });
  (sheet('identify') || []).forEach(({r}) => { if(r[0] !== '') R.identify.push(String(r[0])); });
  return {rules:R, errors, warns};
}

function diffHtml(oldR, newR){
  let h = '', changes = 0;
  for(const [k, def] of Object.entries(RULE_SHEETS)){
    const a = (oldR ? rowsOf[k](oldR) : []).map(r => r.join(' ｜ '));
    const b = rowsOf[k](newR).map(r => r.join(' ｜ '));
    const add = b.filter(x => !a.includes(x)), del = a.filter(x => !b.includes(x));
    changes += add.length + del.length;
    h += `<div style="margin-top:8px"><b>${def.sheet}</b> <span class="muted small">${b.length} 列</span>
      ${add.length || del.length ? '' : ' <span class="chip">沒有變更</span>'}
      ${del.map(x => `<div class="small diff-del">－ ${esc(x)}</div>`).join('')}${add.map(x => `<div class="small diff-add">＋ ${esc(x)}</div>`).join('')}</div>`;
  }
  return {h, changes};
}

async function confirmRules(){
  if(!S.pendingRules || S.pendingErrors.length) return;
  const cust = curCust(), wh = S.whs.find(w => w.id === S.wh);
  const data = {...S.pendingRules, cid:S.cid, cname:cust?.name || '', wh:S.wh, whName:wh?.name || '',
    updatedAt:Date.now(), updatedBy:S.me.email, updatedByName:S.me.name, version:PKG_VERSION};
  try{
    await api.saveRules(S.cid, data);
    S.rules = data; S.pendingRules = null; toast('規則已更新');
    if(S.buf) recompute();
    render();
  }catch(e){ toast('儲存失敗：' + e.message, 5000); }
}

  return h;
}

  const hasInner = e => [e.iL, e.iW, e.iH].every(v => v !== null && v !== undefined && v !== '' && +v > 0);
  const innerOf = e => { if(hasInner(e)) return [+e.iL, +e.iW, +e.iH]; const t = FLUTE_T[e.flute] ?? 0.3; return [e.L, e.W, e.H].map(v => Math.max(0, +v - 2 * t)); };
  const ceilTo = (v, u) => Math.ceil(v / u - 1e-9) * u;
  const toCm = it => [it.L, it.W, it.H].map(v => (+v || 0) * (it.unit === 'mm' ? 0.1 : 1));

  // ---------- 狀態（localStorage） ----------
  const K = {cat:'pkg_pj_catalog_v1', items:'pkg_pj_items_v1', opt:'pkg_pj_opt_v1', tiers:'pkg_pj_tiers_v1', pad:'pkg_pj_pad_v1', bundles:'pkg_pj_bundles_v1'};
  const ls = {get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }};
  const clone = o => JSON.parse(JSON.stringify(o));
  let catalog = ls.get(K.cat) || clone(DEFAULT_CATALOG).map(e => ({...e, on:true}));
  let tiers = ls.get(K.tiers) || clone(DEFAULT_TIERS);
  let pad = ls.get(K.pad) || clone(DEFAULT_PAD);
  let items = ls.get(K.items) || [];
  let bundles = ls.get(K.bundles) || [];
  let opt = {...DEFAULT_OPT, ...(ls.get(K.opt) || {})};
  let last = null;   // 最近一次計算結果（給下載用）
  const saveAll = () => { ls.set(K.cat, catalog); ls.set(K.tiers, tiers); ls.set(K.pad, pad); ls.set(K.items, items); ls.set(K.bundles, bundles); ls.set(K.opt, opt); };

  // ---------- 計算核心 ----------
  function quoteInfo(e){
    if(e.price !== null && e.price !== undefined && e.price !== '' && !isNaN(+e.price)) return {q:+e.price, basis:'定價'};
    if(hasCost(e)) return {q:ceilTo(+e.cost + opt.markup, opt.roundTo || 1), basis:'成本+' + opt.markup};
    if(e.kind === 'carton'){ const sum = (+e.L) + (+e.W) + (+e.H);
      for(const t of tiers) if(t.max === null || t.max === '' || sum <= +t.max) return {q:+t.price, basis:'級距推估'}; }
    return {q:0, basis:'未知'};
  }
  // 裸裝外加空間：依最長邊找級距，每邊加 perSide
  function padFor(dimsCm){
    const mx = Math.max(...dimsCm);
    const rs = pad.slice().sort((a, b) => (a.maxDim ?? 1e9) - (b.maxDim ?? 1e9));
    const r = rs.find(x => x.maxDim === null || x.maxDim === '' || mx <= +x.maxDim) || rs[rs.length - 1];
    return r ? {per:+r.perSide || 0, label:r.label} : {per:0, label:''};
  }
  function blockOptions(dims, n){
    const perms = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
    const seen = new Set(), out = [];
    for(let p = 1; p <= n; p++){ if(n % p) continue;
      for(let q = 1; q <= n / p; q++){ if((n / p) % q) continue; const r = n / p / q;
        for(const pm of perms){ const b = sortDesc([dims[pm[0]] * p, dims[pm[1]] * q, dims[pm[2]] * r]); const k = b.join(','); if(!seen.has(k)){ seen.add(k); out.push(b); } } } }
    return out;
  }
  function fitCheck(block, e, clear){
    const b = block.map(v => v + 2 * clear);
    if(e.kind === 'carton'){ const box = sortDesc(innerOf(e)); const gaps = box.map((v, i) => v - b[i]);
      return {fit:gaps.every(g => g >= 0), gaps, over:gaps.map(g => Math.max(0, -g)), minGap:Math.min(...gaps)}; }
    if(e.kind === 'bag'){ const [bl, bw] = sortDesc([+e.L, +e.W]); const g1 = bl - (b[0] + b[2]), g2 = bw - (b[1] + b[2]);
      return {fit:g1 >= 0 && g2 >= 0, gaps:[g1, g2], over:[Math.max(0, -g1), Math.max(0, -g2)], minGap:Math.min(g1, g2)}; }
    return {fit:false};
  }
  function evaluateItem(item){
    const dims = toCm(item);
    const n = Math.max(1, Math.floor(item.per || 1));
    const qty = Math.max(0, Math.floor(item.qty || 0));
    const boxes = Math.ceil(qty / n);
    const pd = item.bare ? padFor(dims) : {per:0, label:''};
    const clear = opt.clear + pd.per;
    const blocks = blockOptions(dims, n);
    const cands = [];
    catalog.forEach(e => {
      if(!e.on) return;
      if(e.src !== '俬儲' && !opt.web) return;
      if(e.kind !== 'carton' && !(e.kind === 'bag' && opt.bags)) return;
      let best = null;
      for(const bl of blocks){ const r = fitCheck(bl, e, clear); if(r.fit && (!best || r.minGap > best.minGap)) best = {...r, block:bl}; }
      if(best){ const qi = quoteInfo(e); const c = hasCost(e) ? +e.cost : null; cands.push({e, ...best, quote:qi.q, basis:qi.basis, cost:c, margin:c === null ? null : qi.q - c}); }
    });
    const vol = e => e.kind === 'carton' ? e.L * e.W * e.H : e.L * e.W;
    const INF = 1e9, cv = x => x.cost === null ? INF : x.cost;
    const tight = x => x.minGap < 1 ? 1 : 0, own = x => x.e.src === '俬儲' ? 0 : 1, unk = x => x.cost === null ? 1 : 0;
    const cmp = {
      quote:(a, b) => tight(a) - tight(b) || unk(a) - unk(b) || a.quote - b.quote || own(a) - own(b) || cv(a) - cv(b) || vol(a.e) - vol(b.e),
      cost:(a, b) => tight(a) - tight(b) || unk(a) - unk(b) || cv(a) - cv(b) || a.quote - b.quote || vol(a.e) - vol(b.e),
    }[opt.priority] || ((a, b) => a.quote - b.quote);
    cands.sort(cmp);
    const warns = [];
    let pick = cands[0] || null;
    if(!pick){
      let nearest = null;
      catalog.forEach(e => { if(!e.on || e.kind !== 'carton' || (e.src !== '俬儲' && !opt.web)) return;
        for(const bl of blocks){ const r = fitCheck(bl, e, clear); const s = r.over.reduce((a, b) => a + b, 0); if(!nearest || s < nearest.sum) nearest = {e, sum:s, over:r.over}; } });
      const sp = catalog.find(e => e.on && e.kind === 'special');
      if(sp){ pick = {e:sp, special:true, quote:quoteInfo(sp).q, basis:'定價', cost:hasCost(sp) ? +sp.cost : null}; pick.margin = pick.cost === null ? null : pick.quote - pick.cost; }
      warns.push({lv:'red', t:'清單內沒有裝得下的箱子，需特規／訂做'});
      if(nearest){ const lab = ['長', '寬', '高']; const d = nearest.over.map((v, i) => v > 0 ? `${lab[i]}差 ${fmt(v)}cm` : null).filter(Boolean).join('、');
        warns.push({lv:'warn', t:`最接近 ${nearest.e.code}：內徑${d}`}); }
    } else {
      if(pick.minGap < 1) warns.push({lv:'warn', t:`內徑最小間隙 ${fmt(pick.minGap)}cm，建議實測`});
      if(pick.cost !== null && pick.cost > pick.quote) warns.push({lv:'red', t:`成本 ${fmt(pick.cost)} 高於報價 ${pick.quote}`});
      if(pick.cost === null) warns.push({lv:'warn', t:'成本未知' + (pick.basis === '級距推估' ? '，報價依級距推估' : '')});
      if(pick.e.src === '紙箱龍') warns.push({lv:'warn', t:'訂做單價隨數量變動，數量不同請重新試算'});
    }
    // 空間利用率：商品（含裸裝外加）總體積 ÷ 紙箱內徑體積
    let util = null;
    if(pick && !pick.special && pick.e.kind === 'carton'){ const iv = innerOf(pick.e).reduce((a, b) => a * b, 1); const one = dims.map(v => v + 2 * pd.per).reduce((a, b) => a * b, 1); util = iv ? Math.round(one * n / iv * 100) : null; }
    let filler = false;
    if(pick && !pick.special && pick.e.kind === 'carton' && opt.filler && Math.max(...pick.gaps) >= opt.fillGap) filler = true;
    return {item, n, qty, boxes, pick, alts:cands.slice(1, 4), warns, filler, pad:pd, util};
  }
  function summarize(results){
    const map = new Map();
    const add = (e, count, quote) => { const k = e.kind + '|' + e.src + '|' + e.code + '|' + sizeOf(e);
      const cur = map.get(k) || {e, count:0, quote, cost:hasCost(e) ? +e.cost : null}; cur.count += count; map.set(k, cur); };
    results.forEach(r => { if(r.pick && r.boxes) add(r.pick.e, r.boxes, r.pick.quote); });
    const fe = catalog.find(e => e.kind === 'filler' && e.on);
    const fillCount = results.reduce((a, r) => a + (r.filler ? r.boxes : 0), 0);
    if(fe && fillCount) add(fe, fillCount, quoteInfo(fe).q);
    const rows = [...map.values()].map(x => {
      const withBuf = Math.ceil(x.count * (1 + opt.buffer / 100));
      const quoteSub = x.count * x.quote;
      const costSub = x.cost === null ? null : withBuf * x.cost;
      return {...x, withBuf, quoteSub, costSub, margin:costSub === null ? null : quoteSub - costSub};
    });
    const known = rows.filter(r => r.costSub !== null);
    return {rows, quoteTotal:rows.reduce((a, r) => a + r.quoteSub, 0), costTotal:known.reduce((a, r) => a + r.costSub, 0),
      marginKnown:known.reduce((a, r) => a + r.margin, 0), unknownCost:rows.length - known.length};
  }
  function parseText(text){
    const re = /(\d+(?:\.\d+)?)\s*[*xX×＊]\s*(\d+(?:\.\d+)?)\s*[*xX×＊]\s*(\d+(?:\.\d+)?)\s*(cm|CM|公分|mm|MM|公釐)?\s*[,，、:：]?\s*(\d+)\s*(?:個|件|台|箱|組|pcs|PCS|入)?/g;
    const out = []; let lastName = '';
    for(const raw of text.split(/\r?\n/)){
      const line = raw.trim(); if(!line) continue;
      re.lastIndex = 0; const ms = [...line.matchAll(re)];
      if(!ms.length){ lastName = line.replace(/^\s*\d+\s*[.、．)]\s*/, '').replace(/^@\S+\s*/, '').trim(); continue; }
      const before = line.slice(0, ms[0].index).replace(/^\s*\d+\s*[.、．)]\s*/, '').trim();
      if(before) lastName = before;
      for(const m of ms) out.push({name:lastName || '商品', L:+m[1], W:+m[2], H:+m[3], unit:/mm|公釐/i.test(m[4] || '') ? 'mm' : 'cm', qty:+m[5], per:1, bare:false});
    }
    return out;
  }
  // 組合出貨：先從商品數量扣掉組成的組數，剩下的才單件出貨
  function buildJobs(){
    const rem = items.map(it => Math.max(0, Math.floor(+it.qty || 0)));
    const jobs = [];
    bundles.forEach(b => {
      const a = items[b.a], c = items[b.b];
      if(!a || !c || !(b.qa > 0) || !(b.qb > 0)) return;
      const sets = Math.max(0, Math.min(Math.floor(rem[b.a] / b.qa), Math.floor(rem[b.b] / b.qb)));
      if(!sets) return;
      rem[b.a] -= sets * b.qa; rem[b.b] -= sets * b.qb;
      let L = +b.L, W = +b.W, H = +b.H;
      if(!(L > 0 && W > 0 && H > 0)){ const da = sortDesc(toCm(a)), dc = sortDesc(toCm(c)); L = Math.max(da[0], dc[0]); W = Math.max(da[1], dc[1]); H = da[2] * b.qa + dc[2] * b.qb; }
      jobs.push({bundle:true, name:'組合：' + (b.name || `${a.name}＋${c.name}`), L, W, H, unit:'cm', qty:sets, per:1, bare:!!b.bare, auto:!(+b.L > 0 && +b.W > 0 && +b.H > 0)});
    });
    items.forEach((it, i) => { if(+it.L > 0 && +it.W > 0 && +it.H > 0 && rem[i] > 0) jobs.push({...it, qty:rem[i]}); });
    return jobs;
  }

        <td><select data-b="${i}" data-f="a">${opts(b.a)}</select></td><td>${num(`data-b="${i}" data-f="qa" min="1" step="1"`, b.qa, 56)}</td>
        <td><select data-b="${i}" data-f="b">${opts(b.b)}</select></td><td>${num(`data-b="${i}" data-f="qb" min="1" step="1"`, b.qb, 56)}</td>
        <td style="white-space:nowrap">${['L', 'W', 'H'].map(f => `<input type="number" data-b="${i}" data-f="${f}" min="0" step="0.5" value="${esc(+b[f] > 0 ? b[f] : '')}" placeholder="自動" style="width:58px">`).join(' ')}</td>
        <td style="text-align:center"><input type="checkbox" data-b="${i}" data-f="bare" ${b.bare ? 'checked' : ''}></td>
        <td><button class="btn ghost small" onclick="PJ.delBundle(${i})">刪除</button></td></tr>`).join('')
      : `<tr><td colspan="8" class="muted">${items.length >= 2 ? '沒有組合出貨。' : '商品清單至少要有兩項才能設定組合。'}</td></tr>`) + '</tbody>';
  }
  function renderPad(){
    const t = $('pj-pad'); if(!t) return;
    t.innerHTML = `<thead><tr><th>級距</th><th>最長邊 ≤ (cm)</th><th>每邊加 (cm)</th><th></th></tr></thead><tbody>` + pad.map((r, i) => `<tr>
      <td><input type="text" data-p="${i}" data-f="label" value="${esc(r.label)}" style="width:110px"></td>
      <td><input type="number" data-p="${i}" data-f="maxDim" min="0" value="${esc(r.maxDim ?? '')}" placeholder="以上" style="width:70px"></td>
      <td>${num(`data-p="${i}" data-f="perSide" min="0" step="0.5"`, r.perSide, 56)}</td>
      <td><button class="btn ghost small" onclick="PJ.delPad(${i})">刪除</button></td></tr>`).join('') + '</tbody>';
  }
  function renderTiers(){
    const t = $('pj-tiers'); if(!t) return;
    t.innerHTML = `<thead><tr><th>級距</th><th>長寬高合計 ≤</th><th>報價</th></tr></thead><tbody>` + tiers.map((x, i) => `<tr><td>${esc(x.name)}</td>
      <td>${x.max === null ? '以上' : num(`data-t="${i}" data-f="max"`, x.max, 64)}</td><td>${num(`data-t="${i}" data-f="price"`, x.price, 56)}</td></tr>`).join('') + '</tbody>';
  }
  function renderCatalog(){
    const t = $('pj-cat'); if(!t) return;
    const kindName = {carton:'紙箱', bag:'袋', special:'特規箱', filler:'緩衝材'};
    t.innerHTML = `<thead><tr><th>啟用</th><th>來源</th><th>類別</th><th>名稱</th><th>長</th><th>寬</th><th>高</th><th>楞別</th><th title="空白＝外徑扣楞厚自動算">內徑（長/寬/高）</th><th>報價</th><th>成本</th><th>備註</th><th></th></tr></thead><tbody>` +
      catalog.map((e, i) => {
        const dim = f => { const show = e.kind === 'carton' || (e.kind === 'bag' && f !== 'H'); return `<td>${show ? num(`data-c="${i}" data-f="${f}" min="0" step="0.5"`, e[f], 56) : ''}</td>`; };
        const flute = e.kind === 'carton' ? `<select data-c="${i}" data-f="flute">${Object.keys(FLUTE_T).map(k => `<option ${e.flute === k ? 'selected' : ''}>${k}</option>`).join('')}</select>` : '';
        const inner = e.kind === 'carton' ? ['iL', 'iW', 'iH'].map((f, k) => `<input type="number" min="0" step="0.1" data-c="${i}" data-f="${f}" value="${esc(e[f] ?? '')}" placeholder="${fmt(innerOf({...e, iL:null})[k])}" style="width:56px">`).join('') : '';
        const qi = quoteInfo(e);
        return `<tr><td><input type="checkbox" data-c="${i}" data-f="on" ${e.on ? 'checked' : ''}></td>
          <td><span class="chip">${esc(e.src)}</span></td><td class="small">${kindName[e.kind]}${e.kind === 'carton' ? '' : '・' + esc(e.grp)}</td>
          <td><input type="text" data-c="${i}" data-f="code" value="${esc(e.code)}" style="min-width:120px"></td>
          ${dim('L')}${dim('W')}${dim('H')}<td>${flute}</td><td style="white-space:nowrap">${inner}</td>
          <td><input type="number" min="0" step="1" data-c="${i}" data-f="price" value="${esc(e.price ?? '')}" placeholder="${qi.q}" style="width:56px"><div class="muted small">${esc(qi.basis)}</div></td>
          <td><input type="number" min="0" step="0.1" data-c="${i}" data-f="cost" value="${esc(e.cost ?? '')}" placeholder="未知" style="width:60px"></td>
          <td><input type="text" data-c="${i}" data-f="note" value="${esc(e.note)}" style="min-width:160px"></td>
          <td><button class="btn ghost small" onclick="PJ.delCat(${i})">刪除</button></td></tr>`; }).join('') + '</tbody>';
  }

  function compute(){
    const rt = $('pj-res'); if(!rt) return;
    const jobs = buildJobs();
    const res = jobs.map(evaluateItem);
    rt.innerHTML = `<thead><tr><th>品名</th><th>尺寸 × 數量</th><th>建議紙箱</th><th>內徑間隙／利用率</th><th>報價</th><th>成本</th><th>箱數</th><th>提醒</th></tr></thead><tbody>` +
      (res.length ? res.map(r => {
        const it = r.item, p = r.pick, d = toCm(it);
        const pickTxt = p ? `<b>${esc(p.e.code)}</b> <span class="chip">${esc(p.e.src)}</span><div class="muted small">外徑 ${esc(sizeOf(p.e))}${p.e.flute ? '・' + p.e.flute + '楞' : ''}</div>` : '—';
        const altTxt = r.alts.length ? `<div class="muted small">其他可用：${r.alts.map(a => `${esc(a.e.code)}（報${a.quote}/本${a.cost ?? '?'}）`).join('、')}</div>` : '';
        const tags = r.warns.map(w => `<span class="chip ${w.lv}">${esc(w.t)}</span>`);
        if(r.filler) tags.push('<span class="chip ok">加緩衝材</span>');
        if(it.bare) tags.push(`<span class="chip blue">裸裝每邊 +${fmt(r.pad.per)}cm（${esc(r.pad.label)}）</span>`);
        if(it.auto) tags.push('<span class="chip">組合尺寸為自動估算</span>');
        if(!r.warns.length) tags.unshift('<span class="chip ok">OK</span>');
        return `<tr><td>${esc(it.name)}</td>
          <td class="small">${d.map(fmt).join('×')} cm × ${r.qty}${it.unit === 'mm' ? '<div class="muted">（原單位 mm）</div>' : ''}${r.n > 1 ? `<div class="muted">每箱 ${r.n} 個</div>` : ''}</td>
          <td>${pickTxt}${altTxt}</td><td class="small">${p && p.gaps ? p.gaps.map(fmt).join(' / ') : '—'}${r.util !== null ? `<div class="muted">利用率 ${r.util}%</div>` : ''}</td>
          <td class="mono">${p ? p.quote : '—'}</td><td class="mono">${p && p.cost !== null ? fmt(p.cost) : '?'}</td>
          <td class="mono"><b>${r.boxes}</b></td><td>${tags.join('')}</td></tr>`; }).join('')
      : '<tr><td colspan="8" class="muted">填好長寬高與數量後會自動計算。</td></tr>') + '</tbody>';

    const s = summarize(res);
    last = {res, s};
    const st = $('pj-sum');
    st.innerHTML = `<thead><tr><th>包材</th><th>外徑規格</th><th>來源</th><th>需求數</th><th>含備品</th><th>報價</th><th>報價小計</th><th>成本</th><th>成本小計</th><th>毛利</th></tr></thead><tbody>` +
      (s.rows.length ? s.rows.map(x => `<tr><td>${esc(x.e.code)}</td><td class="small">${esc(sizeOf(x.e))}</td><td><span class="chip">${esc(x.e.src)}</span></td>
        <td class="mono">${x.count.toLocaleString()}</td><td class="mono">${x.withBuf.toLocaleString()}</td><td class="mono">${x.quote}</td><td class="mono">${money(x.quoteSub)}</td>
        <td class="mono">${x.cost === null ? '?' : fmt(x.cost)}</td><td class="mono">${x.costSub === null ? '?' : money(x.costSub)}</td>
        <td class="mono" style="${x.margin !== null && x.margin < 0 ? 'color:var(--danger)' : ''}">${x.margin === null ? '?' : money(x.margin)}</td></tr>`).join('')
        + `<tr><td colspan="6"><b>合計</b></td><td class="mono"><b>${money(s.quoteTotal)}</b></td><td></td><td class="mono"><b>${money(s.costTotal)}</b></td><td class="mono"><b>${money(s.marginKnown)}</b></td></tr>
           <tr><td colspan="10" class="muted small">報價小計＝實際使用數 × 報價（向客人收）；成本小計＝含 ${opt.buffer}% 備品的採購數 × 成本（不含運費）。${s.unknownCost ? `有 ${s.unknownCost} 項成本未知，未列入成本與毛利。` : ''}</td></tr>`
      : '<tr><td colspan="10" class="muted">—</td></tr>') + '</tbody>';
    if(!s.rows.length){ $('pj-qt').textContent = ''; $('pj-ct').textContent = ''; return; }
    const q = ['【包材費用預估】'];
    res.forEach(r => { const d = toCm(r.item); q.push(`・${r.item.name} ${d.map(fmt).join('*')} ×${r.qty}：${r.boxes}箱 × ${r.pick ? r.pick.quote : '?'}元 = ${r.pick ? money(r.boxes * r.pick.quote) : '?'}元`); });
    const fr = s.rows.find(x => x.e.kind === 'filler'); if(fr) q.push(`・緩衝材 ${fr.count}份 × ${fr.quote}元 = ${money(fr.quoteSub)}元`);
    q.push(`合計約 ${money(s.quoteTotal)} 元（耗材論件計，月底結算後於次月請款單列出）`);
    $('pj-qt').textContent = q.join('\n');
    const c = ['【內部】採購與毛利（含' + opt.buffer + '%備品，未含運費）'];
    s.rows.forEach(x => c.push(`・${x.e.code}（${x.e.src}）採購 ${x.withBuf} × ${x.cost === null ? '?' : fmt(x.cost)} = ${x.costSub === null ? '?' : money(x.costSub)}｜收 ${money(x.quoteSub)}｜毛利 ${x.margin === null ? '?' : money(x.margin)}${x.e.note ? '｜' + x.e.note : ''}`));
    c.push(`成本合計 ${money(s.costTotal)}｜報價合計 ${money(s.quoteTotal)}｜已知毛利 ${money(s.marginKnown)}${s.unknownCost ? `（${s.unknownCost}項成本未知）` : ''}`);
    res.forEach(r => r.warns.forEach(w => c.push(`⚠ ${r.item.name}：${w.t}`)));
    $('pj-ct').textContent = c.join('\n');
  }

  // ---------- 事件 ----------
  function onInput(e){
    const t = e.target, d = t.dataset, f = d.f, val = () => t.type === 'checkbox' ? t.checked : t.value;
    if(d.o !== undefined){ const k = d.o; opt[k] = t.type === 'checkbox' ? t.checked : (k === 'priority' ? t.value : (+t.value || 0)); saveAll(); renderCatalog(); compute(); return; }
    if(d.i !== undefined){ const it = items[+d.i]; if(!it) return;
      it[f] = (f === 'name' || f === 'unit') ? t.value : f === 'bare' ? t.checked : (t.value === '' ? '' : +t.value);
      saveAll(); if(f === 'name') renderBundles(); compute(); return; }
    if(d.b !== undefined){ const b = bundles[+d.b]; if(!b) return;
      b[f] = f === 'name' ? t.value : f === 'bare' ? t.checked : (t.value === '' ? '' : +t.value); saveAll(); compute(); return; }
    if(d.p !== undefined){ const r = pad[+d.p]; if(!r) return;
      r[f] = f === 'label' ? t.value : f === 'maxDim' ? (t.value === '' ? null : +t.value) : (+t.value || 0); saveAll(); compute(); return; }
    if(d.t !== undefined){ tiers[+d.t][f] = +t.value; saveAll(); renderCatalog(); compute(); return; }
    if(d.c !== undefined){ const c = catalog[+d.c]; if(!c) return;
      if(f === 'on') c.on = t.checked; else if(f === 'code' || f === 'note' || f === 'flute') c[f] = t.value;
      else if(['cost', 'price', 'iL', 'iW', 'iH'].includes(f)) c[f] = t.value === '' ? null : +t.value; else c[f] = +t.value;
      saveAll(); if(e.type === 'change') renderCatalog(); compute(); }
  }
  function mount(){
    const m = $('app-main'); if(!m) return;
    m.oninput = onInput;
    m.onchange = e => { if(e.target.type === 'checkbox' || e.target.tagName === 'SELECT' || e.target.dataset.c !== undefined) onInput(e); };
    if(!items.length && !$('pj-paste').value) $('pj-paste').value = '1.身體烘乾機產品外包裝\n30*31*13 cm 594個\n2. 空氣清淨機產品外包裝\n34*25*21 cm 97個\n41*31*28 cm 35個';
    renderItems(); renderBundles(); renderPad(); renderTiers(); renderCatalog(); compute();
  }

  function exportXlsx(){
    if(!last || !last.res.length){ toast('還沒有計算結果'); return; }
    const {res, s} = last;
    const a1 = [['品名', '尺寸(cm)', '數量', '每箱裝', '裸裝外加(每邊cm)', '建議包材', '來源', '利用率', '報價', '成本', '箱數', '提醒']];
    res.forEach(r => a1.push([r.item.name, toCm(r.item).map(fmt).join('x'), r.qty, r.n, r.item.bare ? r.pad.per : '', r.pick ? r.pick.e.code : '', r.pick ? r.pick.e.src : '',
      r.util !== null ? r.util + '%' : '', r.pick ? r.pick.quote : '', r.pick && r.pick.cost !== null ? r.pick.cost : '', r.boxes, r.warns.map(w => w.t).join('、')]));
    const a2 = [['包材', '外徑規格', '來源', '需求數', '含備品', '報價', '報價小計', '成本', '成本小計', '毛利']];
    s.rows.forEach(x => a2.push([x.e.code, sizeOf(x.e), x.e.src, x.count, x.withBuf, x.quote, x.quoteSub, x.cost ?? '', x.costSub ?? '', x.margin ?? '']));
    a2.push(['合計', '', '', '', '', '', s.quoteTotal, '', s.costTotal, s.marginKnown]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a1), '選箱結果');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a2), '包材總表');
    XLSX.writeFile(wb, '專案包材試算_' + getTodayTW() + '.xlsx');
  }
  function backup(){
    const blob = new Blob([JSON.stringify({type:'pkg-project-backup', version:PKG_VERSION, at:getTodayTW(), catalog, tiers, pad, items, bundles, opt}, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '專案試算備份_' + getTodayTW() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  // 匯入：紙箱清單依「來源＋名稱」合併，同名但內容不同的會列出來讓使用者決定是否覆蓋
  function restore(file){
    if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d; try{ d = JSON.parse(rd.result); }catch(e){ toast('不是有效的備份檔'); return; }
      if(d.type !== 'pkg-project-backup'){ toast('不是專案試算的備份檔'); return; }
      const key = e => e.src + '|' + e.code;
      const cur = new Map(catalog.map(e => [key(e), e]));
      const conflicts = [], adds = [];
      (d.catalog || []).forEach(e => { const c = cur.get(key(e)); if(!c) adds.push(e); else if(JSON.stringify(c) !== JSON.stringify(e)) conflicts.push(e); });
      let overwrite = false;
      if(conflicts.length) overwrite = confirm(`備份檔有 ${conflicts.length} 個紙箱和這台電腦的設定不同：\n${conflicts.slice(0, 10).map(e => '・' + e.src + ' ' + e.code).join('\n')}${conflicts.length > 10 ? '\n…' : ''}\n\n按「確定」用備份檔覆蓋，按「取消」保留這台電腦的設定。`);
      catalog.push(...adds);
      if(overwrite) conflicts.forEach(e => { const i = catalog.findIndex(x => key(x) === key(e)); if(i >= 0) catalog[i] = e; });
      const exist = new Set(items.map(it => JSON.stringify([it.name, it.L, it.W, it.H, it.qty])));
      const newItems = (d.items || []).filter(it => !exist.has(JSON.stringify([it.name, it.L, it.W, it.H, it.qty])));
      if(newItems.length && confirm(`備份檔有 ${newItems.length} 個這台電腦沒有的商品，要加進商品清單嗎？`)) items.push(...newItems);
      saveAll(); render();
      toast(`匯入完成：新增 ${adds.length} 個紙箱${conflicts.length ? `，${overwrite ? '覆蓋' : '保留'} ${conflicts.length} 個不同的設定` : ''}`, 4000);
    };
    rd.readAsText(file);
  }

  return {
    html, mount, exportXlsx, backup, restore,
    parse(){ const got = parseText($('pj-paste').value); if(!got.length){ toast('沒有抓到「長*寬*高 數量」'); return; } items.push(...got); saveAll(); renderItems(); renderBundles(); compute(); toast(`加入 ${got.length} 筆`); },
    addItem(){ items.push({name:'', L:'', W:'', H:'', unit:'cm', qty:'', per:1, bare:false}); saveAll(); renderItems(); renderBundles(); },
    delItem(i){ items.splice(i, 1); bundles = bundles.filter(b => b.a !== i && b.b !== i).map(b => ({...b, a:b.a > i ? b.a - 1 : b.a, b:b.b > i ? b.b - 1 : b.b})); saveAll(); renderItems(); renderBundles(); compute(); },
    clearItems(){ if(!confirm('清空商品清單和組合出貨？')) return; items = []; bundles = []; saveAll(); renderItems(); renderBundles(); compute(); },
    addBundle(){ if(items.length < 2){ toast('商品清單至少要有兩項'); return; } bundles.push({name:'', a:0, qa:1, b:1, qb:1, L:'', W:'', H:'', bare:false}); saveAll(); renderBundles(); compute(); },
    delBundle(i){ bundles.splice(i, 1); saveAll(); renderBundles(); compute(); },
    addPad(){ pad.push({label:'新級距', maxDim:null, perSide:5}); saveAll(); renderPad(); compute(); },
    delPad(i){ pad.splice(i, 1); saveAll(); renderPad(); compute(); },
    addCarton(){ catalog.push({kind:'carton', src:'自訂', grp:'紙箱', code:'新紙箱', L:0, W:0, H:0, flute:'B', cost:null, note:'', on:true}); saveAll(); renderCatalog(); },
    addBag(){ catalog.push({kind:'bag', src:'俬儲', grp:'自訂', code:'新袋', L:0, W:0, price:0, cost:null, note:'', on:true}); saveAll(); renderCatalog(); },
    delCat(i){ catalog.splice(i, 1); saveAll(); renderCatalog(); compute(); },
    resetCat(){ if(!confirm('紙箱清單、報價級距、裸裝外加空間都恢復預設？')) return; catalog = clone(DEFAULT_CATALOG).map(e => ({...e, on:true})); tiers = clone(DEFAULT_TIERS); pad = clone(DEFAULT_PAD); saveAll(); renderTiers(); renderPad(); renderCatalog(); compute(); toast('已恢復預設清單'); },
    async copy(id){ const t = $(id).textContent; if(!t) return; try{ await navigator.clipboard.writeText(t); toast('已複製'); }catch(e){ prompt('複製以下內容：', t); } },
    _test:{parseText, evaluateItem, buildJobs, padFor, set(o){ if(o.items) items = o.items; if(o.bundles) bundles = o.bundles; if(o.opt) opt = {...opt, ...o.opt}; }, get last(){ return last; }},
  };
})();

/* ================= 拖放上傳 ================= */
document.addEventListener('dragover', e => { const dz = $('dz'); if(dz){ e.preventDefault(); dz.classList.add('drag'); } });
document.addEventListener('dragleave', e => { const dz = $('dz'); if(dz && e.target === dz) dz.classList.remove('drag'); });
document.addEventListener('drop', e => { const dz = $('dz'); if(dz){ e.preventDefault(); dz.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); } });

$('ver').textContent = PKG_VERSION + (DEMO ? '・測試模式' : '');
</script>
</body>
</html>
